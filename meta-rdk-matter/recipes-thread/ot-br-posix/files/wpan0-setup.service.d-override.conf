[Unit]
After=systemd-udev-settle.service

[Service]
EnvironmentFile=-/etc/default/otbr-agent
ExecStartPre=/bin/sh -c '\
  PATH=/usr/sbin:/sbin:/usr/bin:/bin; \
  NCP="${OTBR_NCP_PATH:-/dev/ttyAMA0}"; \
  [ -e "${NCP}" ] || NCP="/dev/ttyS0"; \
  [ -e "${NCP}" ] || NCP="/dev/ttyACM0"; \
  if [ ! -e "${NCP}" ]; then \
    echo "wpan0-setup: NCP serial not found. Set OTBR_NCP_PATH in /etc/default/otbr-agent (e.g., /dev/ttyAMA0)"; \
    exit 1; \
  fi; \
  echo "wpan0-setup: using NCP ${NCP}"'
